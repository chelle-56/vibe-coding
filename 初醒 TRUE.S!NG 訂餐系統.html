uData.customization_options.sugar_levels.forEach(level \x3d\x3e \x7b\\n          sugarOpt.innerHTML +\x3d `\x3cbutton onclick\x3d\\\x22selectOption(\x27sugar\x27, \x27$\x7blevel\x7d\x27)\\\x22 id\x3d\\\x22btn-sugar-$\x7blevel\x7d\\\x22 class\x3d\\\x22sugar-btn border-2 border-gray-300 p-2 font-bold text-xs text-center rounded-none bg-white\\\x22\x3e$\x7blevel\x7d\x3c\\\/button\x3e`;\\n        \x7d);\\n        selectOption(\x27sugar\x27, \x27正常\x27); \\n      \x7d\\n\\n      \\n      const iceOpt \x3d document.getElementById(\x27ice-options\x27);\\n      const iceNote \x3d document.getElementById(\x27ice-note\x27);\\n      iceOpt.innerHTML \x3d \x27\x27;\\n      iceNote.innerText \x3d \x27\x27;\\n\\n      if(item.note \x26\x26 item.note.includes(\\\x22冰塊固定\\\x22)) \x7b\\n        iceNote.innerText \x3d \\\x22(本品項冰塊固定)\\\x22;\\n        iceOpt.innerHTML \x3d `\x3cbutton class\x3d\\\x22border-2 border-blue-900 bg-blue-50 text-primary p-2 font-bold text-xs text-center rounded-none\\\x22 disabled\x3e固定冰塊\x3c\\\/button\x3e`;\\n        currentItem.selectedIce \x3d \\\x22固定冰塊\\\x22;\\n      \x7d else \x7b\\n        menuData.customization_options.ice_levels.forEach(level \x3d\x3e \x7b\\n          if(item.cold_only \x26\x26 (level \x3d\x3d\x3d \x27熱\x27 || level \x3d\x3d\x3d \x27溫\x27)) return; \/\/ 排除熱飲\\n          iceOpt.innerHTML +\x3d `\x3cbutton onclick\x3d\\\x22selectOption(\x27ice\x27, \x27$\x7blevel\x7d\x27)\\\x22 id\x3d\\\x22btn-ice-$\x7blevel\x7d\\\x22 class\x3d\\\x22ice-btn border-2 border-gray-300 p-2 font-bold text-xs text-center rounded-none bg-white\\\x22\x3e$\x7blevel\x7d\x3c\\\/button\x3e`;\\n        \x7d);\\n        selectOption(\x27ice\x27, \x27正常\x27); \/\/ 預設\\n      \x7d\\n\\n      \\n      const toppingOpt \x3d document.getElementById(\x27topping-options\x27);\\n      toppingOpt.innerHTML \x3d \x27\x27;\\n      currentItem.selectedToppings \x3d \x7b\x7d;\\n      menuData.toppings.forEach((top, idx) \x3d\x3e \x7b\\n        toppingOpt.innerHTML +\x3d `\x3cbutton onclick\x3d\\\x22toggleTopping(\x27$\x7btop.name\x7d\x27, $\x7btop.price\x7d)\\\x22 id\x3d\\\x22btn-top-$\x7btop.name\x7d\\\x22 class\x3d\\\x22topping-btn border-2 border-gray-300 p-2 font-bold text-xs text-center rounded-none bg-white\\\x22\x3e$\x7btop.name\x7d +$$\x7btop.price\x7d\x3c\\\/button\x3e`;\\n      \x7d);\\n\\n      document.getElementById(\x27customize-modal\x27).classList.remove(\x27hidden\x27);\\n    \x7d\\n\\n    function closeModal() \x7b\\n      document.getElementById(\x27customize-modal\x27).classList.add(\x27hidden\x27);\\n    \x7d\\n\\n    function selectSize(size, price) \x7b\\n      currentItem.selectedSize \x3d size;\\n      currentItem.basePrice \x3d price;\\n      document.querySelectorAll(\x27.size-btn\x27).forEach(b \x3d\x3e b.classList.remove(\x27border-blue-900\x27, \x27bg-blue-50\x27, \x27text-primary\x27));\\n      document.getElementById(`btn-size-$\x7bsize\x7d`).classList.add(\x27border-blue-900\x27, \x27bg-blue-50\x27, \x27text-primary\x27);\\n    \x7d\\n\\n    function selectOption(type, value) \x7b\\n      if(type \x3d\x3d\x3d \x27sugar\x27) \x7b\\n        currentItem.selectedSugar \x3d value;\\n        document.querySelectorAll(\x27.sugar-btn\x27).forEach(b \x3d\x3e b.classList.remove(\x27border-blue-900\x27, \x27bg-blue-50\x27, \x27text-primary\x27));\\n      \x7d else if(type \x3d\x3d\x3d \x27ice\x27) \x7b\\n        currentItem.selectedIce \x3d value;\\n        document.querySelectorAll(\x27.ice-btn\x27).forEach(b \x3d\x3e b.classList.remove(\x27border-blue-900\x27, \x27bg-blue-50\x27, \x27text-primary\x27));\\n      \x7d\\n      const targetBtn \x3d document.getElementById(`btn-$\x7btype\x7d-$\x7bvalue\x7d`);\\n      if(targetBtn) targetBtn.classList.add(\x27border-blue-900\x27, \x27bg-blue-50\x27, \x27text-primary\x27);\\n    \x7d\\n\\n    function toggleTopping(name, price) \x7b\\n      if(currentItem.selectedToppings\x5bname\x5d) \x7b\\n        delete currentItem.selectedToppings\x5bname\x5d;\\n        document.getElementById(`btn-top-$\x7bname\x7d`).classList.remove(\x27border-blue-900\x27, \x27bg-blue-50\x27, \x27text-primary\x27);\\n      \x7d else \x7b\\n        currentItem.selectedToppings\x5bname\x5d \x3d price;\\n        document.getElementById(`btn-top-$\x7bname\x7d`).classList.add(\x27border-blue-900\x27, \x27bg-blue-50\x27, \x27text-primary\x27);\\n      \x7d\\n    \x7d\\n\\n    function alterModalQty(amt) \x7b\\n      const qtySpan \x3d document.getElementById(\x27modal-qty\x27);\\n      let currentQty \x3d parseInt(qtySpan.innerText) + amt;\\n      if(currentQty \x3c 1) currentQty \x3d 1;\\n      qtySpan.innerText \x3d currentQty;\\n    \x7d\\n\\n    \/\/ 計算單杯價格並加入購物車\\n    function addToCart() \x7b\\n      let singlePrice \x3d currentItem.basePrice;\\n      let toppingList \x3d \x5b\x5d;\\n      \\n      for (let \x5bname, price\x5d of Object.entries(currentItem.selectedToppings)) \x7b\\n        singlePrice +\x3d price;\\n        toppingList.push(name);\\n      \x7d\\n\\n      const qty \x3d parseInt(document.getElementById(\x27modal-qty\x27).innerText);\\n\\n      cart.push(\x7b\\n        name: currentItem.name,\\n        size: currentItem.selectedSize,\\n        sugar: currentItem.selectedSugar,\\n        ice: currentItem.selectedIce,\\n        toppings: toppingList,\\n        singlePrice: singlePrice,\\n        quantity: qty\\n      \x7d);\\n\\n      closeModal();\\n      updateCartUI();\\n    \x7d\\n\\n    function removeFromCart(idx) \x7b\\n      cart.splice(idx, 1);\\n      updateCartUI();\\n    \x7d\\n\\n    \\n    function updateCartUI() \x7b\\n      const container \x3d document.getElementById(\x27cart-items\x27);\\n      const totalCountSpan \x3d document.getElementById(\x27total-count\x27);\\n      const totalPriceSpan \x3d document.getElementById(\x27total-price\x27);\\n\\n      if(cart.length \x3d\x3d\x3d 0) \x7b\\n        container.innerHTML \x3d `\x3cp class\x3d\\\x22text-gray-400 text-center py-4\\\x22\x3e目前購物車空空的喔！\x3c\\\/p\x3e`;\\n        totalCountSpan.innerText \x3d \x270 杯\x27;\\n        totalPriceSpan.innerText \x3d \x270\x27;\\n        return;\\n      \x7d\\n\\n      container.innerHTML \x3d \x27\x27;\\n      let totalCount \x3d 0;\\n      let totalPrice \x3d 0;\\n\\n      cart.forEach((item, idx) \x3d\x3e \x7b\\n        totalCount +\x3d item.quantity;\\n        totalPrice +\x3d (item.singlePrice * item.quantity);\\n\\n        let toppingStr \x3d item.toppings.length \x3e 0 ? `+$\x7bitem.toppings.join(\x27\/\x27)\x7d` : \x27原味\x27;\\n        let sizeLabel \x3d item.size \x3d\x3d\x3d \x27l\x27 ? \x27大杯(L)\x27 : \x27中杯(M)\x27;\\n\\n        container.innerHTML +\x3d `\\n          \x3cdiv class\x3d\\\x22bg-gray-50 p-2 border-l-4 border-secondary flex justify-between items-center\\\x22\x3e\\n            \x3cdiv\x3e\\n              \x3cdiv class\x3d\\\x22font-bold text-gray-900\\\x22\x3e$\x7bitem.name\x7d ($\x7bsizeLabel\x7d)\x3c\\\/div\x3e\\n              \x3cdiv class\x3d\\\x22text-\x5b11px\x5d text-gray-500 mt-0.5\\\x22\x3e$\x7bitem.sugar\x7d \/ $\x7bitem.ice\x7d \/ $\x7btoppingStr\x7d\x3c\\\/div\x3e\\n              \x3cdiv class\x3d\\\x22text-xs text-blue-900 font-medium mt-1\\\x22\x3e$$\x7bitem.singlePrice\x7d × $\x7bitem.quantity\x7d\x3c\\\/div\x3e\\n            \x3c\\\/div\x3e\\n            \x3cbutton onclick\x3d\\\x22removeFromCart($\x7bidx\x7d)\\\x22 class\x3d\\\x22text-red-500 hover:text-red-700 font-bold px-2\\\x22\x3e✕\x3c\\\/button\x3e\\n          \x3c\\\/div\x3e\\n        `;\\n      \x7d);\\n\\n      totalCountSpan.innerText \x3d `$\x7btotalCount\x7d 杯`;\\n      totalPriceSpan.innerText \x3d totalPrice;\\n    \x7d\\n\\n    \/\/ 處理表單提交（送出訂單到試算表）\\n    document.getElementById(\x27order-form\x27).addEventListener(\x27submit\x27, function(e) \x7b\\n      e.preventDefault();\\n\\n      if(cart.length \x3d\x3d\x3d 0) \x7b\\n        alert(\x27您的購物車內還沒有任何餐點喔！\x27);\\n        return;\\n      \x7d\\n\\n      const submitBtn \x3d document.getElementById(\x27submit-btn\x27);\\n      submitBtn.disabled \x3d
